<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverse Defence: Web Rhythm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030303;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1500px;
            max-height: 950px;
            background: #08080c;
            box-shadow: 0 0 40px rgba(220, 20, 60, 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .bg-ambience {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(220, 20, 60, 0.25) 0%, rgba(0, 217, 255, 0.1) 50%, rgba(0, 0, 0, 0) 80%);
            pointer-events: none;
            z-index: 1;
        }

        .mask-hud {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            pointer-events: none;
        }

        .eye {
            width: 150px;
            height: 150px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
            transition: transform 0.1s ease;
        }

        .left-eye {
            transform: rotate(90deg) scale(0.8);
        }

        .right-eye {
            transform: rotate(-90deg) scaleX(-1) scale(0.8);
        }

        .eye-frame {
            fill: #111111;
            stroke: #dc143c;
            stroke-width: 4;
        }

        .eye-lens {
            fill: #ffffff;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 3, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 40;
            transition: opacity 0.4s ease;
        }

        .hidden {
            display: none !important;
        }

        .game-title {
            color: #ffffff;
            font-size: 5.7rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(220, 20, 60, 0.9);
            text-align: center;
            margin-bottom: 5px;
        }

        .game-author {
            color: #00d9ff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .menu-box {
            background-color: rgba(0, 0, 0, .5);
            border-radius: 16px;
            padding: 25px;
            width: 85%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }


        .start_btn {
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 14px 32px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            border-radius: 40px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        .start_btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .full_btn {
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 14px 32px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            border-radius: 40px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        .full_btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .control-box {
            background-color: rgba(0, 0, 0, .5);
            border-radius: 16px;
            padding: 10px 15px;
            height: 50px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: row;
            gap: 15px;

            text-align: center;
        }

        .menu_btn {
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 5px 32px;
            height: 30px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            cursor: pointer;
            border-radius: 40px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        .menu_btn:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .key-hints {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .key-badge {
            background: #111;
            border: 2px solid #00d9ff;
            color: #00d9ff;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.4);
        }

        #damageOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.35);
            z-index: 30;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease-out;
        }

        #loading-text {
            color: #00d9ff;
            font-size: 0.9rem;
            font-weight: bold;
        }

        #level-up-banner {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 20px #ffcc00;
            pointer-events: none;
            z-index: 35;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: scale(0.5);
        }

        #level-up-banner.show {
            opacity: 1;
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div class="bg-ambience"></div>
        <div id="damageOverlay"></div>
        <div id="level-up-banner">LEVEL UP!</div>

        <div class="mask-hud">
            <svg class="eye left-eye" id="leftEye" viewBox="0 0 200 280">
                <path class="eye-frame"
                    d="M 175,25 C 125,10 60,30 20,110 C -5,160 0,210 35,245 C 75,280 140,260 185,180 C 205,140 200,75 175,25 Z" />
                <path class="eye-lens"
                    d="M 160,38 C 118,25 62,42 28,112 C 8,155 12,198 40,228 C 72,258 130,240 168,172 C 185,135 180,80 160,38 Z" />
            </svg>
            <svg class="eye right-eye" id="rightEye" viewBox="0 0 200 280">
                <path class="eye-frame"
                    d="M 175,25 C 125,10 60,30 20,110 C -5,160 0,210 35,245 C 75,280 140,260 185,180 C 205,140 200,75 175,25 Z" />
                <path class="eye-lens"
                    d="M 160,38 C 118,25 62,42 28,112 C 8,155 12,198 40,228 C 72,258 130,240 168,172 C 185,135 180,80 160,38 Z" />
            </svg>
        </div>

        <div id="controls-container" class="control-box">
            <button class="menu_btn" id="full_btn">FULLSCREEN</button>
            <form action="spideys.html">
                <button class="menu_btn" type="submit" value="RETURN" onclick="history.back()">STOP</button>
            </form>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="start-screen" class="overlay">
            <div class="game-title">Multiverse Defense: Web Rhythm</div>
            <div class="game-author">by MrTanoso</div>

            <div class="menu-box">
                <div id="loading-text"></div>

                <button id="start_btn" class="start_btn">PLAY</button>
                <button class="full_btn" id="full_btn">FULLSCREEN</button>
            </div>

        </div>
    </div>



    <div id="results-screen" class="overlay hidden">
        <div class="game-title" id="results-title">VICTORY!</div>

        <div class="menu-box">
            <div style="color: #00d9ff; font-size: 0.85rem; text-transform: uppercase;">Final Score</div>
            <div id="res-score" style="font-size: 2.2rem; font-weight: bold; color: #fff; margin-bottom: 5px;">0
            </div>
            <div style="color: #ffcc00; font-size: 0.9rem; font-weight: bold; margin-bottom: 15px;" id="res-level">
                REACHED LEVEL 1</div>

            <div style="display: flex; justify-content: space-around; width: 100%; margin-top: 5px;">
                <div>
                    <div style="color: #ffcc00; font-size: 1.2rem; font-weight: bold;" id="res-combo">0x</div>
                    <div style="color: #aaa; font-size: 0.75rem;">MAX COMBO</div>
                </div>
                <div>
                    <div style="color: #00ff88; font-size: 1.2rem; font-weight: bold;" id="res-acc">0%</div>
                    <div style="color: #aaa; font-size: 0.75rem;">ACCURACY</div>
                </div>
            </div>

            <button id="restart-btn" class="start_btn">PLAY AGAIN</button>
            <form action="spideys.html">
                <button class="start_btn" type="submit" value="RETURN" onclick="history.back()">RETURN</button>
            </form>
        </div>
    </div>
    </div>

    <script>

        const menu_btn = document.getElementById('full_btn');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const damageOverlay = document.getElementById('damageOverlay');
        const levelUpBanner = document.getElementById('level-up-banner');
        const leftEye = document.getElementById('leftEye');
        const rightEye = document.getElementById('rightEye');
        const loadingText = document.getElementById('loading-text');

        let audioCtx, audioBuffer, audioSource;
        let isPlaying = false;
        let songStartTime = 0;
        let score = 0, combo = 0, maxCombo = 0, totalHits = 0, totalNotesPlayed = 0, health = 100;
        const keys = {};

        let currentLevel = 1;
        let scrollSpeed = 650;
        const levelThresholds = [
            { level: 1, scoreNeeded: 0, speed: 650, name: "ROOKIE" },
            { level: 2, scoreNeeded: 5000, speed: 750, name: "DEFENDER" },
            { level: 3, scoreNeeded: 20000, speed: 850, name: "AVENGER" },
            { level: 4, scoreNeeded: 40000, speed: 950, name: "MULTIVERSE HERO" },
            { level: 5, scoreNeeded: 500000, speed: 1100, name: "SUPREME SPIDER" }
        ];

        const KEYS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'];
        const KEY_LABELS = ['D', 'F', 'J', 'K'];
        const LANE_COLORS = ['#dc143c', '#00d9ff', '#ffcc00', '#ff1493'];

        const villainsData = [
            { icon: "🎃" }, { icon: "🐙" }, { icon: "⏳" }, { icon: "🦎" },
            { icon: "⚡" }, { icon: "🕷️" }, { icon: "🔮" }, { icon: "🦅" }
        ];

        const lanes = [
            { active: false, pulse: 0 },
            { active: false, pulse: 0 },
            { active: false, pulse: 0 },
            { active: false, pulse: 0 }
        ];

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            keys[e.key] = false;
        });

        menu_btn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        let notes = [];
        let judgements = [];
        let webs = [];

        const hitWindowGood = 0.135;
        const hitWindowGreat = 0.090;
        const hitWindowPerfect = 0.045;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function analyzeAudioBeats(buffer) {
            const channelData = buffer.getChannelData(0);
            const sampleRate = buffer.sampleRate;
            const chunkSize = Math.floor(sampleRate * 0.05);
            const beats = [];

            let prevEnergy = 0;
            const threshold = 1.35;

            for (let i = 0; i < channelData.length; i += chunkSize) {
                let sum = 0;
                for (let j = i; j < i + chunkSize && j < channelData.length; j++) {
                    sum += channelData[j] * channelData[j];
                }
                const energy = Math.sqrt(sum / chunkSize);
                const time = i / sampleRate;

                if (energy > prevEnergy * threshold && energy > 0.08) {
                    if (beats.length === 0 || (time - beats[beats.length - 1]) > 0.18) {
                        beats.push(time);
                    }
                }
                prevEnergy = energy;
            }

            let lastLane = -1;
            return beats.map((time) => {
                let lane;
                do {
                    lane = Math.floor(Math.random() * 4);
                } while (lane === lastLane && Math.random() < 0.8);

                lastLane = lane;
                const villain = villainsData[Math.floor(Math.random() * villainsData.length)];

                return {
                    lane: lane,
                    time: time,
                    hit: false,
                    missed: false,
                    icon: villain.icon
                };
            });
        }

        async function loadAndStartGame() {
            if (loadingText) loadingText.innerText = "Loading...";

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            try {
                const response = await fetch('spidey.mp3');
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                notes = analyzeAudioBeats(audioBuffer);

                score = 0; combo = 0; maxCombo = 0; totalHits = 0; totalNotesPlayed = 0; health = 100;
                currentLevel = 1;
                scrollSpeed = levelThresholds[0].speed;
                judgements = []; webs = [];

                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('results-screen').classList.add('hidden');

                if (audioSource) audioSource.stop();
                audioSource = audioCtx.createBufferSource();
                audioSource.buffer = audioBuffer;
                audioSource.connect(audioCtx.destination);

                audioSource.onended = () => { if (isPlaying) endGame(true); };

                songStartTime = audioCtx.currentTime;
                audioSource.start(0);

                isPlaying = true;
                requestAnimationFrame(gameLoop);
            } catch (err) {
                if (loadingText) loadingText.innerText = "ERROR: Ensure 'spidey.mp3' is present in your root directory!";
            }
        }

        function checkLevelUp() {
            const nextLevel = levelThresholds.find(l => l.level === currentLevel + 1);
            if (nextLevel && score >= nextLevel.scoreNeeded) {
                currentLevel = nextLevel.level;
                scrollSpeed = nextLevel.speed;

                levelUpBanner.innerText = `LEVEL ${currentLevel}: ${nextLevel.name}!`;
                levelUpBanner.classList.add('show');
                setTimeout(() => levelUpBanner.classList.remove('show'), 1200);
            }
        }

        function endGame(victory = true) {
            isPlaying = false;
            if (audioSource) {
                try { audioSource.stop(); } catch (e) { }
            }

            const totalPossible = notes.length;
            const accuracy = totalNotesPlayed > 0 ? Math.min(100, Math.round((totalHits / totalPossible) * 100)) : 0;

            document.getElementById('results-title').textContent = victory ? "VICTORY!" : "YOU DIED";
            document.getElementById('results-title').style.color = victory ? "#00ff88" : "#ff2a2a";
            document.getElementById('res-score').innerText = score.toLocaleString();
            document.getElementById('res-level').innerText = `REACHED LEVEL ${currentLevel} (${levelThresholds[currentLevel - 1].name})`;
            document.getElementById('res-combo').innerText = maxCombo + 'x';
            document.getElementById('res-acc').innerText = accuracy + '%';

            document.getElementById('results-screen').classList.remove('hidden');
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            const keyIndex = KEYS.indexOf(e.code);
            if (keyIndex !== -1 && !lanes[keyIndex].active) {
                lanes[keyIndex].active = true;
                lanes[keyIndex].pulse = 1.0;
                checkHit(keyIndex);
            }
        });

        window.addEventListener('keyup', (e) => {
            const keyIndex = KEYS.indexOf(e.code);
            if (keyIndex !== -1) {
                lanes[keyIndex].active = false;
            }
        });

        function checkHit(laneIndex) {
            const hitLineY = canvas.height - 110;
            const currentTime = audioCtx.currentTime - songStartTime;

            let closestNote = null;
            let minDiff = Infinity;

            for (let note of notes) {
                if (note.lane === laneIndex && !note.hit && !note.missed) {
                    const timeDiff = Math.abs(note.time - currentTime);
                    if (timeDiff < minDiff) {
                        minDiff = timeDiff;
                        closestNote = note;
                    }
                }
            }

            if (closestNote && minDiff <= hitWindowGood) {
                closestNote.hit = true;
                totalNotesPlayed++;

                let rating = 'GOOD', points = 100;
                if (minDiff <= hitWindowPerfect) {
                    rating = 'PERFECT'; points = 300; totalHits += 1.0;
                } else if (minDiff <= hitWindowGreat) {
                    rating = 'GREAT'; points = 200; totalHits += 0.75;
                } else {
                    totalHits += 0.5;
                }

                combo++;
                if (combo > maxCombo) maxCombo = combo;
                score += (points + combo * 10) * currentLevel;
                health = Math.min(100, health + 2);

                checkLevelUp();
                addJudgement(rating, laneIndex);
                triggerWebEffect(laneIndex, hitLineY);
                animateEyesHit();
            }
        }

        function animateEyesHit() {
            leftEye.style.transform = 'rotate(90deg) scale(1.15)';
            rightEye.style.transform = 'rotate(-90deg) scaleX(-1) scale(1.15)';
            setTimeout(() => {
                leftEye.style.transform = 'rotate(90deg) scale(0.8)';
                rightEye.style.transform = 'rotate(-90deg) scaleX(-1) scale(0.8)';
            }, 100);
        }

        function triggerWebEffect(lane, targetY) {
            const laneWidth = canvas.width / 4;
            webs.push({
                sx: canvas.width / 2, sy: 50,
                ex: lane * laneWidth + laneWidth / 2, ey: targetY,
                life: 1.0
            });
        }

        function addJudgement(text, lane) {
            judgements.push({
                text: text, lane: lane,
                y: canvas.height - 150, opacity: 1.0, scale: 1.4
            });
        }

        function gameLoop() {
            if (!isPlaying) return;

            const currentTime = audioCtx.currentTime - songStartTime;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const laneWidth = canvas.width / 4;
            const hitLineY = canvas.height - 110;

            for (let i = 0; i < 4; i++) {
                const x = i * laneWidth;
                ctx.fillStyle = lanes[i].active ? 'rgba(220, 20, 60, 0.2)' : 'rgba(15, 15, 20, 0.4)';
                ctx.fillRect(x, 0, laneWidth, canvas.height);

                ctx.strokeStyle = 'rgba(220, 20, 60, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
                ctx.stroke();

                if (lanes[i].pulse > 0) {
                    ctx.fillStyle = LANE_COLORS[i];
                    ctx.globalAlpha = lanes[i].pulse * 0.3;
                    ctx.fillRect(x, 0, laneWidth, canvas.height);
                    ctx.globalAlpha = 1.0;
                    lanes[i].pulse -= 0.05;
                }

                ctx.fillStyle = lanes[i].active ? '#ffffff' : '#00d9ff';
                ctx.font = 'bold 22px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(KEY_LABELS[i], x + laneWidth / 2, hitLineY + 55);
            }

            ctx.strokeStyle = '#dc143c';
            ctx.lineWidth = 4;
            ctx.shadowColor = '#dc143c';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(0, hitLineY); ctx.lineTo(canvas.width, hitLineY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            for (let note of notes) {
                if (note.hit) continue;

                const timeDiff = note.time - currentTime;
                const y = hitLineY - (timeDiff * scrollSpeed);

                if (y > hitLineY + 50 && !note.missed) {
                    note.missed = true;
                    combo = 0;
                    totalNotesPlayed++;
                    health -= 12;
                    addJudgement('MISS', note.lane);

                    damageOverlay.style.opacity = '1';
                    setTimeout(() => damageOverlay.style.opacity = '0', 150);

                    if (health <= 0) {
                        endGame(false);
                        return;
                    }
                }

                if (y > -50 && y < canvas.height + 50) {
                    const x = note.lane * laneWidth + laneWidth / 2;

                    ctx.fillStyle = 'rgba(10, 10, 10, 0.9)';
                    ctx.strokeStyle = '#dc143c';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(x, y, 25, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();

                    ctx.font = '22px Segoe UI';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(note.icon, x, y);
                }
            }

            for (let i = webs.length - 1; i >= 0; i--) {
                let w = webs[i];
                ctx.beginPath();
                ctx.moveTo(w.sx, w.sy); ctx.lineTo(w.ex, w.ey);
                ctx.strokeStyle = `rgba(255, 255, 255, ${w.life})`;
                ctx.lineWidth = 3;
                ctx.stroke();

                w.life -= 0.08;
                if (w.life <= 0) webs.splice(i, 1);
            }

            for (let i = judgements.length - 1; i >= 0; i--) {
                const j = judgements[i];
                ctx.font = `bold ${22 * j.scale}px Segoe UI`;
                ctx.textAlign = 'center';
                ctx.fillStyle = j.text === 'PERFECT' ? '#00d9ff' : (j.text === 'GREAT' ? '#00ff88' : '#ff2a2a');
                ctx.globalAlpha = j.opacity;
                ctx.fillText(j.text, j.lane * laneWidth + laneWidth / 2, j.y);

                j.y -= 1; j.opacity -= 0.04;
                if (j.opacity <= 0) judgements.splice(i, 1);
            }
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Segoe UI';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score.toLocaleString()}`, 15, 30);
            ctx.fillStyle = '#ffcc00';
            ctx.font = 'bold 14px Segoe UI';
            ctx.fillText(`LVL ${currentLevel}: ${levelThresholds[currentLevel - 1].name}`, 15, 50);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Segoe UI';
            ctx.textAlign = 'right';
            ctx.fillText(`${combo}x`, canvas.width - 15, 35);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(15, 60, canvas.width - 30, 6);
            ctx.fillStyle = health > 30 ? '#00d9ff' : '#dc143c';
            ctx.fillRect(15, 60, (canvas.width - 30) * (health / 100), 6);

            requestAnimationFrame(gameLoop);
        }

        document.getElementById('start_btn').addEventListener('click', loadAndStartGame);
        document.getElementById('restart-btn').addEventListener('click', loadAndStartGame);

    </script>
